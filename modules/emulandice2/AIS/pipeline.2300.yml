
project:
  task1:
    python_dependencies: "xarray dask numpy scipy"
    executable: "python3"
    script_noupload: "emulandice_project.py"
    arguments:
      - --ice_source
      - AIS
      - --region
      - ALL
      - --emu_file
      - emu_file/AIS_ALL_Kori_PISM_pow_exp_10_EMULATOR.RData
    options:
      - "pipeline_id"
      - "scenario"
      - "climate_data_file"
      - "baseyear"
      - "pyear_start"
      - "pyear_end"
      - "pyear_step"
      - "seed"
    upload_input_data:
      - "%MODULE_PATH%/../shared/emulandice_environment.sh"
      - "%MODULE_PATH%/../shared/emulandice_steer.sh"
      - "%MODULE_PATH%/../shared/emulandice2/main.R"
      - "%MODULE_PATH%/../shared/emulandice_project.py"
    upload_and_extract_input_data:
      - "%MODULE_PATH%/../shared/emulandice_bundled_dependencies.tgz"
      - "emulandice2_AIS_project_2300_240528_data.tgz"
    global_total_files:
      - "%PIPELINE_ID%_ALL_globalsl.nc"
    download_output_data:
      - "%PIPELINE_ID%_ALL_globalsl.nc"


postprocess:
  task1:
    executable: "python3"
    script_noupload: "emulandice_postprocess.py"
    arguments:
      - --ncfiles
      - "%PIPELINE_ID%_EAIS1_globalsl.nc"
      - "%PIPELINE_ID%_EAIS2_globalsl.nc"
      - "%PIPELINE_ID%_EAIS3_globalsl.nc"
      - "%PIPELINE_ID%_EAIS4_globalsl.nc"
      - "%PIPELINE_ID%_EAIS5_globalsl.nc"
      - "%PIPELINE_ID%_EAIS6_globalsl.nc"
      - "%PIPELINE_ID%_EAIS7_globalsl.nc"
      - "%PIPELINE_ID%_PEN_globalsl.nc"
      - "%PIPELINE_ID%_WAIS1_globalsl.nc"
      - "%PIPELINE_ID%_WAIS2_globalsl.nc"
      - "%PIPELINE_ID%_WAIS3_globalsl.nc"
    options:
      - "locationfile"
      - "chunksize"
      - "pipeline_id"
      - "scenario"
      - "baseyear"
      - "grdfingerprintfile"
    upload_input_data:
      - '%MODULE_PATH%/../shared/read_locationfile.py'
      - '%MODULE_PATH%/../shared/AssignFP.py'
      - '%MODULE_PATH%/../shared/ReadFingerprint.py'
      - '%MODULE_PATH%/../shared/grd_fingerprintmap.yml'
      - '%MODULE_PATH%/../shared/emulandice_postprocess.py'
    upload_and_extract_input_data:
      - 'grd_fingerprints_data2.tgz'
    copy_shared_data:
      - '$SHARED/location.lst'
    copy_input_data:
      project:
        task1:
          - "%PIPELINE_ID%_EAIS1_globalsl.nc"
          - "%PIPELINE_ID%_EAIS2_globalsl.nc"
          - "%PIPELINE_ID%_EAIS3_globalsl.nc"
          - "%PIPELINE_ID%_EAIS4_globalsl.nc"
          - "%PIPELINE_ID%_EAIS5_globalsl.nc"
          - "%PIPELINE_ID%_EAIS6_globalsl.nc"
          - "%PIPELINE_ID%_EAIS7_globalsl.nc"
          - "%PIPELINE_ID%_PEN_globalsl.nc"
          - "%PIPELINE_ID%_WAIS1_globalsl.nc"
          - "%PIPELINE_ID%_WAIS2_globalsl.nc"
          - "%PIPELINE_ID%_WAIS3_globalsl.nc"
    # download_output_data:
    #   - "%PIPELINE_ID%_quantiles.nc"
    local_total_files:
      - "%PIPELINE_ID%_localsl.nc"
