
project:
  task1:
    python_dependencies: "xarray dask numpy scipy"
    executable: "python3"
    script_noupload: "emulandice_project.py"
    arguments:
      - --ice_source
      - GIS
      - --region
      - ALL
      - --emu_file
      - emu_file/GIS_ALL_CISM_pow_exp_01_EMULATOR.RData 
    options:
      - "pipeline_id"
      - "scenario"
      - "climate_data_file"
      - "baseyear"
      - "pyear_start"
      - "pyear_end"
      - "pyear_step"
      - "seed"
      - "cyear_start"
      - "cyear_end"
    upload_input_data:
      - "%MODULE_PATH%/../shared/emulandice_environment.sh"
      - "%MODULE_PATH%/../shared/emulandice_steer.sh"
      - "%MODULE_PATH%/../shared/emulandice2/main.R"
      - "%MODULE_PATH%/../shared/emulandice_project.py"
    upload_and_extract_input_data:
      - "%MODULE_PATH%/../shared/emulandice_bundled_dependencies.tgz"
      - "emulandice2_GrIS_project_2300_240528_data.tgz"
    global_total_files:
      - "%PIPELINE_ID%_ALL_globalsl.nc"
    download_output_data:
      - "%PIPELINE_ID%_ALL_globalsl.nc"


postprocess:
  task1:
    executable: "python3"
    script_noupload: "emulandice_postprocess.py"
    arguments:
      - --ncfiles
      - "%PIPELINE_ID%_CW_globalsl.nc"
      - "%PIPELINE_ID%_SW_globalsl.nc"
      - "%PIPELINE_ID%_SE_globalsl.nc"
      - "%PIPELINE_ID%_NE_globalsl.nc"
      - "%PIPELINE_ID%_NO_globalsl.nc"
      - "%PIPELINE_ID%_NW_globalsl.nc"
    options:
      - "locationfile"
      - "chunksize"
      - "pipeline_id"
      - "scenario"
      - "baseyear"
      - "grdfingerprintfile"
    upload_input_data:
      - '%MODULE_PATH%/../shared/read_locationfile.py'
      - '%MODULE_PATH%/../shared/AssignFP.py'
      - '%MODULE_PATH%/../shared/ReadFingerprint.py'
      - '%MODULE_PATH%/../shared/grd_fingerprintmap.yml'
      - '%MODULE_PATH%/../shared/emulandice_postprocess.py'
    upload_and_extract_input_data:
      - 'grd_fingerprints_data2.tgz'
    copy_shared_data:
      - '$SHARED/location.lst'
    copy_input_data:
      project:
        task1:
          - "%PIPELINE_ID%_CW_globalsl.nc"
          - "%PIPELINE_ID%_SW_globalsl.nc"
          - "%PIPELINE_ID%_SE_globalsl.nc"
          - "%PIPELINE_ID%_NE_globalsl.nc"
          - "%PIPELINE_ID%_NO_globalsl.nc"
          - "%PIPELINE_ID%_NW_globalsl.nc"
    # download_output_data:
    #   - "%PIPELINE_ID%_quantiles.nc"
    local_total_files:
      - "%PIPELINE_ID%_localsl.nc"
